{% load static %}
<div class="login-header">
    <button class="btn-pill" id="test-device-btn" onclick="showTestDeviceCard()">
        <img src="{% static 'images/test-device.png' %}" style="height:13px; width: auto; margin-bottom: 2px;">
        Test Your Device
    </button>
</div>

<!-- ============ Test Your Device Overlay ============ -->

<div class="test-device-card" id="test-device-card" style="display: none;">
    <h2 class="test-device-title">This Device Meets the Listed<br>Requirements</h2>
    <p class="test-device-subtitle">Run this check as close to test day as possible.<br>
        Find out what's checked and what isn't at<br>
        <a id="test-device-link"
            style="color: #324dc7; text-decoration: underline; font-weight: 600; cursor: pointer;">bluebook.org/device-check</a>.
    </p>

    <div class="test-device-checks">
        <div class="test-device-check-item">
            <span class="test-device-check-icon">✓</span>
            <span class="test-device-check-label">Memory</span>
        </div>
        <div class="test-device-check-item">
            <span class="test-device-check-icon">✓</span>
            <span class="test-device-check-label">Operating system</span>
        </div>
        <div class="test-device-check-item">
            <span class="test-device-check-icon">✓</span>
            <span class="test-device-check-label">Disk space</span>
        </div>
    </div>

    <button class="test-device-done-btn" onclick="hideTestDeviceCard()">Done</button>
</div>

<script>
    function showTestDeviceCard() {
        const testDeviceCard = document.getElementById('test-device-card');
        testDeviceCard.style.display = 'flex';
        const loginCard = document.getElementsByClassName('login-card')[0];
        loginCard.style.display = 'none';
        const testDeviceBtn = document.getElementById('test-device-btn');
        testDeviceBtn.style.display = 'none';
        const languageSelector = document.getElementById('language-selector');
        languageSelector.style.display = 'none';
    }

    function hideTestDeviceCard() {
        const testDeviceCard = document.getElementById('test-device-card');
        testDeviceCard.style.display = 'none';
        const loginCard = document.getElementsByClassName('login-card')[0];
        loginCard.style.display = 'flex';
        const testDeviceBtn = document.getElementById('test-device-btn');
        testDeviceBtn.style.display = 'flex';
        const languageSelector = document.getElementById('language-selector');
        languageSelector.style.display = 'flex';
    }
</script>
