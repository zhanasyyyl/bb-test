<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New note</title>
</head>
<body style="margin: 0; padding: 0; background: #f4f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f5f7;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width: 480px; background: #ffffff; border-radius: 8px; font-family: Arial, Helvetica, sans-serif; color: #1e1e1e;">
          <tr>
            <td style="padding: 32px 32px 8px; font-size: 16px; font-weight: bold;">BB Test</td>
          </tr>
          <tr>
            <td style="padding: 8px 32px 0; font-size: 20px; line-height: 28px; font-weight: bold;">New note</td>
          </tr>
          <tr>
            <td style="padding: 12px 32px 0; font-size: 15px; line-height: 22px;">
              <strong>{{ name }}</strong> wrote a note on Question {{ question }} in {{ module }}.
            </td>
          </tr>
          <tr>
            <td style="padding: 16px 32px 24px;">
              <div style="font-size: 12px; color: #666666; margin-bottom: 4px;">Note</div>
              <div style="font-size: 15px; line-height: 22px;">{{ text|linebreaksbr }}</div>
            </td>
          </tr>
          <tr>
            <td style="padding: 16px 32px 32px; border-top: 1px solid #e5e5e5; font-size: 12px; line-height: 18px; color: #666666;">
              You're receiving this because this address is the contact email on a BB Test account.<br><br>
              BB Test is an independent SAT practice site &middot; <a href="https://bbtest.shop" style="color: #666666;">bbtest.shop</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
