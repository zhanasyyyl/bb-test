{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebook</title>
  <link rel="preconnect" href="https://ajax.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/png" href="{% static 'images/favicon.png' %}">
  {% for url in prefetch_static_urls %}
  <link rel="prefetch" href="{{ url }}">
  {% endfor %}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.MQ = MathQuill.getInterface(2);
    });
  </script>

  {% if not debug_mode %}
  <script>
    // --- Anti-inspection measures (production only) ---
    (function () {
      'use strict';

      // 1. Disable right-click context menu
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      });

      // 2. Block keyboard shortcuts used to open DevTools or view source
      document.addEventListener('keydown', function (e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          return false;
        }

        // Ctrl+Shift+I  (DevTools – Elements)
        // Ctrl+Shift+J  (DevTools – Console)
        // Ctrl+Shift+C  (DevTools – Inspect element)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey &&
          (e.key === 'I' || e.key === 'i' ||
            e.key === 'J' || e.key === 'j' ||
            e.key === 'C' || e.key === 'c')) {
          e.preventDefault();
          return false;
        }

        // Ctrl+U  (View Source)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) {
          e.preventDefault();
          return false;
        }

        // Ctrl+S  (Save Page)
        if ((e.ctrlKey || e.metaKey) && (e.key === 'S' || e.key === 's')) {
          e.preventDefault();
          return false;
        }
      });

      // 3. Detect DevTools being opened via debugger-timing heuristic
      var devtoolsOpen = false;
      var threshold = 160;

      function detectDevTools() {
        var widthThreshold = window.outerWidth - window.innerWidth > threshold;
        var heightThreshold = window.outerHeight - window.innerHeight > threshold;

        if (widthThreshold || heightThreshold) {
          if (!devtoolsOpen) {
            devtoolsOpen = true;
            document.documentElement.innerHTML = '';
          }
        } else {
          devtoolsOpen = false;
        }
      }

      setInterval(detectDevTools, 1000);

      // 5. Console-clear loop to discourage console use
      try {
        var _c = console;
        Object.defineProperty(window, 'console', {
          get: function () {
            throw new Error('Console access is disabled.');
          },
          set: function () { }
        });
      } catch (_) { }
    })();
  </script>
  {% endif %}
</head>

<body class="{% block body_class %}{% endblock %}">
  <div class="window-frame">
    {% if not view_locked %}
    <header class="title-bar" id="windows-title-bar" style="display: none;">
      <div class="title-bar-left">
        <img src="/static/images/logo-white.svg" style="width: 15px; padding: 2px; background-color: #324dc7;" alt="">
        <span class="title-text">Bluebook</span>
      </div>
      <div class="title-bar-right">
        <span class="window-control minimize">—</span>
        <span class="window-control maximize">&#9744;</span>
        <span class="window-control close">&#10005;</span>
      </div>
    </header>
    <script>
      (function () {
        var isWindows = navigator.platform.indexOf('Win') > -1 || navigator.userAgent.indexOf('Windows') > -1;
        if (isWindows) {
          document.getElementById('windows-title-bar').style.display = 'flex';
        }
      })();
    </script>
    {% endif %}

    <main class="content-area">
      {% block content %}
      {% endblock %}
    </main>
  </div>
</body>

</html>
