# Cache lifetime for /static/ files (http-level directive).
# Install: copy to /etc/nginx/conf.d/ (Ubuntu includes conf.d/*.conf inside the http block).
# Used by static-cache.conf.

map $uri $static_expires {
    # Hashed names from {% static %} (e.g. styles.5428a288f2aa.css) change
    # whenever the file changes, so browsers can keep them forever
    "~\.[0-9a-f]{12}\.[A-Za-z0-9]+$"  max;
    # Unhashed paths, e.g. the /static/images/... URLs inside questions.json
    default                          1h;
}
