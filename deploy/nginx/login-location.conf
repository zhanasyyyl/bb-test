# Applies the "login" limit zone to /cb_login/ and /admin/login/ (server-level directives).
# Install: copy to /etc/nginx/snippets/ and add this line inside the
# bbtest.shop server block (the HTTPS one), next to "location /":
#     include snippets/login-location.conf;
#
# A burst from one IP: the first 50 requests go straight through, the next
# 150 queue and are released at 10/s, anything beyond 200 gets a 429.
# Raise burst before an exam if one test center will have more than ~400
# students signing in at once from the same IP.

location = /cb_login/ {
    limit_req zone=login burst=200 delay=50;
    limit_req_status 429;

    # Keep these in sync with the proxy settings in your "location /" block
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# The admin sign-in page; one superuser at a time, so no burst needed
location = /admin/login/ {
    limit_req zone=login burst=10;
    limit_req_status 429;

    # Keep these in sync with the proxy settings in your "location /" block
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
