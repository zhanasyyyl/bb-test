# Compression and caching for /static/ (location-level directives).
# Install: copy to /etc/nginx/snippets/ and add this line inside your
# existing "location /static/ { ... }" block, below its alias/root line:
#     include snippets/static-cache.conf;
# Needs static-expires.conf in conf.d/.

expires $static_expires;

# collectstatic writes a .gz copy next to each compressible file; serve it as-is
gzip_static on;
# Compress on the fly anything without a .gz copy
gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_vary on;

# No add_header here on purpose: an add_header in a location replaces every
# add_header inherited from the server block (e.g. HSTS) for these responses.
