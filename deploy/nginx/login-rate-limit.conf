# Per-IP rate limit for sign-in POSTs (http-level directives).
# Install: copy to /etc/nginx/conf.d/ (Ubuntu includes conf.d/*.conf inside the http block).
#
# 10 POSTs/s per IP leaves most of the server's CPU for others if one IP
# floods sign-ins (each attempt costs a password hash, even for unknown
# emails). It is per IP, not per user, so keep it generous: a whole test
# center usually shares one IP. See login-location.conf for the burst size.

# Only POSTs get a key; requests with an empty key are not limited
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $login_limit_key zone=login:10m rate=10r/s;
