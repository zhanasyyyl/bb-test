# Applies the sign-in rate limit (location-level directives).
# Install: copy to /etc/nginx/snippets/ and add this line inside your
# existing "location / { ... }" block (the one that proxies to gunicorn):
#     include snippets/login-limit.conf;
# Needs login-rate-limit.conf in conf.d/. Only sign-in POSTs are limited;
# everything else in "location /" is unaffected.
#
# A burst from one IP: the first 50 sign-ins go straight through, the next
# 150 queue and are released at 10/s, anything beyond 200 gets a 429.
# Raise burst before an exam if one test center will have more than ~400
# students signing in at once from the same IP.

limit_req zone=login burst=200 delay=50;
limit_req_status 429;
